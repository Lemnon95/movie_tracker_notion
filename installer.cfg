[Application]
name=Movie Tracker
version=1.2.0
entry_point = movie_tracker.main:main

icon = icon.ico
console = true

[Python]
version = 3.9.0
bitness = 64

[Include]
packages = movie_tracker
files = movie_tracker/config.py
	movie_tracker/assets > $INSTDIR\pkgs\movie_tracker
	LICENSE.md > $INSTDIR
	PRIVACY.md > $INSTDIR
	THIRD_PARTY_NOTICES.md > $INSTDIR
pypi_wheels =
	requests==2.27.1
	urllib3==1.26.20
	charset-normalizer==2.0.12
	certifi==2022.9.14
	idna==2.10
	setuptools==60.2.0
	wheel==0.37.1
	colorama==0.4.6

[Build]
installer_name = movietracker_1.2.0_installer.exe

[Command movie_tracker]
entry_point = movie_tracker.main:main
